<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        RADAR - New Transaction
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<div class="radar-glow"></div>


<!-- HEADER -->

<header class="radar-header">

    <h1 style="margin:0;text-align:center;">
  <img src="/images/radar-logo.svg" alt="RADAR" style="width:min(520px,90%);height:auto;">
</h1>

    <div class="radar-subtitle">
        Risk Analysis and Detection of Anonymous Response
    </div>

</header>


<!-- TRANSACTION FORM -->

<main class="radar-container">

    <section class="radar-panel radar-form">

        <div class="radar-welcome">

            <h2>
                Transaction Analysis
            </h2>

            <p>
                Submit a transaction for real-time
                fraud risk analysis.
            </p>

        </div>


        <form action="transaction"
              method="post">


            <label for="amount">
                Transaction Amount
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0.01"
                placeholder="Enter transaction amount"
                required
            >


            <label for="merchant">
                Merchant
            </label>

            <input
                type="text"
                id="merchant"
                name="merchant"
                maxlength="150"
                placeholder="Enter merchant name"
                required
            >


            <label for="location">
                Transaction Location
            </label>

            <input
                type="text"
                id="location"
                name="location"
                maxlength="150"
                placeholder="Enter transaction location"
                required
            >


            <button type="submit">
                Analyze Transaction
            </button>

        </form>


        <div style="text-align:center; margin-top:25px;">

            <a class="radar-button-secondary"
               href="dashboard.html">
                Back to Dashboard
            </a>

        </div>

    </section>

</main>


<footer class="radar-footer">

    RADAR
    &nbsp; • &nbsp;
    REAL-TIME RISK ANALYSIS

</footer>


</body>

</html>
